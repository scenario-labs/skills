# Lint for every Python script the skills ship, run by `pnpm lint:py` (AGENTS.md, "Repo tooling").
# Pyflakes rules (unused imports and variables, undefined names, broken f-strings), plus SIM115: a
# file opened outside a `with` block, which the code-quality bot kept finding in review. A handle
# no `with` can hold, such as a lock returned to its caller, carries `# noqa: SIM115` and the reason.
# S110 fails an `except` (bare, `Exception` or `BaseException`) whose body is only `pass`, since a
# swallowed error lets a run report success. A comment beside the `pass` does not satisfy it: a
# deliberate one carries `# noqa: S110` and the reason on the `except` line.
# Formatting and style stay with each script's author.
extend-exclude = [".agents"] # vendored dev skills, refreshed by `npx skills update`

[lint]
select = ["F", "SIM115", "S110"]

# Expert scripts that predate S110, one entry per file with its count of hits, so a new file is
# checked. Review them family by family (tracked in issue #375); remove a file's entry once each of
# its clauses is fixed or carries a `# noqa: S110` with the reason. Recount a file with
# `uvx ruff@0.16.10 check --select S110 --config 'lint.per-file-ignores = {}' <file>`.
