name: Browser suites

# Runs the suites that need a real browser: the playable-ads QA run on the shipped template
# (tests/scenario-playable-ads/test_qa.py) and the motion-loops page checks and render. The CI
# workflow's script-tests job installs no Playwright, so they skip there, and its in-process suites
# only reach these scripts through stand-ins. Only changes to those skills, their tests, or the
# Playwright locks trigger it: the browser download and the QA run take minutes.
on:
  pull_request:
    paths:
      - "skills/scenario-playable-ads/**"
      - "skills/scenario-motion-loops/**"
      - "skills/scenario-kinetic-music-video/assets/npm/**"
      - "tests/scenario-playable-ads/**"
      - "tests/scenario-motion-loops/**"
      - ".github/workflows/browser.yml"
  push:
    branches: [main]
    paths:
      - "skills/scenario-playable-ads/**"
      - "skills/scenario-motion-loops/**"
      - "skills/scenario-kinetic-music-video/assets/npm/**"
      - "tests/scenario-playable-ads/**"
      - "tests/scenario-motion-loops/**"
      - ".github/workflows/browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Browser suites on Linux
    runs-on: ubuntu-24.04
    # A normal run takes under 10 minutes; the cap stops a hung browser or apt mirror early.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/scenario-playable-ads/requirements-browser-ci.txt
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Reuses the ffmpeg .debs the CI workflow's ubuntu-24.04 leg caches; a miss downloads them.
      - name: Resolve ffmpeg packages
        id: apt
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          echo "key=$(sudo apt-get install --print-uris -qq ffmpeg | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore ffmpeg packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-ffmpeg-ubuntu-24.04-${{ steps.apt.outputs.key }}
          restore-keys: apt-ffmpeg-ubuntu-24.04-
      - name: Install ffmpeg
        # The archives directory belongs to the runner user, which apt's _apt sandbox cannot write.
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get install -y \
            -o Dir::Cache::archives="$HOME/apt-archives" \
            -o APT::Sandbox::User=root \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            ffmpeg
          ffmpeg -version | head -n 1
      - name: Install Playwright for Python and its Chromium
        run: |
          pip install --require-hashes --only-binary=:all: -r tests/scenario-playable-ads/requirements-browser-ci.txt
          python -m playwright install --with-deps chromium
      # The kinetic scaffold's lock is the repository's one locked npm Playwright, so the motion-loops
      # suite uses it rather than a lock of its own. A Chromium matching its release is installed
      # too, a no-op while both Playwright releases agree.
      - name: Install Playwright for Node and its Chromium
        run: |
          pw="$RUNNER_TEMP/playwright-node"
          mkdir -p "$pw"
          cp skills/scenario-kinetic-music-video/assets/npm/package.json \
            skills/scenario-kinetic-music-video/assets/npm/package-lock.json "$pw/"
          npm ci --prefix "$pw" --ignore-scripts --no-audit --no-fund
          (cd "$pw" && npx --no-install playwright install chromium)
          echo "MOTION_LOOPS_PLAYWRIGHT_DIR=$pw" >> "$GITHUB_ENV"
      - name: Playable ads QA on the shipped template
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests/scenario-playable-ads -p test_qa.py -v 2>&1 | tee qa.log
          # A skip here means Playwright or Chromium did not start: fail instead.
          if grep -q "skipped 'needs ffmpeg, Playwright" qa.log; then exit 1; fi
      - name: Motion loops page checks and render
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          pnpm exec vitest run tests/scenario-motion-loops 2>&1 | tee loops.log
          # The browser suite skips when it cannot find Playwright: fail instead.
          if grep -Eq "Tests .*skipped" loops.log; then exit 1; fi
