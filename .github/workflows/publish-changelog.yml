name: publish-changelog

# Posts a GitHub release's notes to the public changelog at
# www.scenario.com/changelog.
#
# This lives off the `release: published` event rather than inside
# release-please.yml so a failed POST stays recoverable. release-please sets
# its `release_created` output only on the single run that creates the
# release, so a publish step there could never be re-fired: one transient 502
# and that release's notes would never reach the changelog. Here, a failure
# fails the job visibly, "Re-run jobs" retries it, and workflow_dispatch
# republishes any tag by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.37.3"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-changelog-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    # Forks hold neither the ingest secret nor the releases this reads.
    if: github.repository == 'scenario-labs/skills'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release notes to www.scenario.com
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          CHANGELOG_INGEST_SECRET: ${{ secrets.CHANGELOG_INGEST_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CHANGELOG_INGEST_SECRET:-}" ]; then
            echo "::error::CHANGELOG_INGEST_SECRET is not set for this repository"
            exit 1
          fi

          payload="$(mktemp)"
          gh release view "$TAG" --json body --jq .body \
            | jq -Rs --arg repo skills '{repo: $repo, changelog: .}' > "$payload"

          # The bearer token is fed to curl on stdin via --config. Passing it as
          # a -H argument would put it in this process's argv, where anything
          # else on the runner can read it out of /proc/*/cmdline.
          printf 'header = "Authorization: Bearer %s"\n' "$CHANGELOG_INGEST_SECRET" \
            | curl --config - \
              --silent --show-error --location --fail-with-body \
              --max-time 30 --retry 5 --retry-all-errors \
              --request POST https://www.scenario.com/api/changelog/ingest \
              --header "Content-Type: application/json" \
              --data-binary "@$payload"

          echo "Published $TAG to www.scenario.com/changelog"
