name: Blender toolkit

# Runs tests/scenario-blender-expert against a real Blender on Linux. Without
# Blender its live suites skip, so the CI workflow's script-tests job never runs
# them. Only Blender script or test changes trigger it: the download is about
# 380 MB, and docs changes cannot break the toolkit.
on:
  pull_request:
    paths:
      - "skills/dcc/blender/*/scripts/**"
      - ".github/actions/install-blender/**"
      - "tests/scenario-blender-expert/**"
      - ".github/workflows/blender.yml"
  push:
    branches: [main]
    paths:
      - "skills/dcc/blender/*/scripts/**"
      - ".github/actions/install-blender/**"
      - "tests/scenario-blender-expert/**"
      - ".github/workflows/blender.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolkit:
    name: Blender on Linux
    runs-on: ubuntu-latest
    env:
      # The release the skills were verified on; bump it with the skills.
      BLENDER_RELEASE: 5.2.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Blender
        id: blender
        uses: ./.github/actions/install-blender
        with:
          release: ${{ env.BLENDER_RELEASE }}
      - name: Toolkit tests
        env:
          BLENDER: ${{ steps.blender.outputs.path }}
        run: |
          set -o pipefail
          pip install --require-hashes --only-binary=:all: -r tests/scenario-blender-expert/requirements-ci.txt
          python -B -m unittest discover -s tests/scenario-blender-expert -v 2>&1 | tee tests.log
          # A live suite that skips here means Blender did not start, or the release
          # fell below the family's floor (tests/scenario-blender-expert/live_blender.py).
          if grep -qE "skipped .Blender (is not installed|.* is below the family floor)" tests.log; then exit 1; fi
