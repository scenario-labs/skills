name: Blender toolkit

# Runs tests/scenario-blender-expert against a real Blender on Linux. Without
# Blender its live suites skip, so the CI workflow's script-tests job never runs
# them. Only Blender script or test changes trigger it: the download is about
# 380 MB, and docs changes cannot break the toolkit.
on:
  pull_request:
    paths:
      - "skills/dcc/blender/*/scripts/**"
      - "tests/scenario-blender-expert/**"
      - ".github/workflows/blender.yml"
  push:
    branches: [main]
    paths:
      - "skills/dcc/blender/*/scripts/**"
      - "tests/scenario-blender-expert/**"
      - ".github/workflows/blender.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolkit:
    name: Blender on Linux
    runs-on: ubuntu-latest
    env:
      # The release the skills were verified on; bump it with the skills.
      BLENDER_RELEASE: 5.2.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Blender
        run: |
          asset="blender-${BLENDER_RELEASE}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender${BLENDER_RELEASE%.*}"
          curl -fsSL -o "$asset" "$base/$asset"
          curl -fsSL -o sums.txt "$base/blender-${BLENDER_RELEASE}.sha256"
          grep " ${asset}\$" sums.txt > want.txt
          sha256sum -c want.txt
          dir="$RUNNER_TEMP/blender"
          mkdir -p "$dir"
          tar -xJf "$asset" -C "$dir" --strip-components=1
          # Background mode still loads the X11 and GL libraries.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1 > /dev/null
          "$dir/blender" -b --factory-startup --version | head -n 1
          echo "BLENDER=$dir/blender" >> "$GITHUB_ENV"
      - name: Toolkit tests
        run: |
          set -o pipefail
          pip install --require-hashes --only-binary=:all: -r tests/scenario-blender-expert/requirements-ci.txt
          python -B -m unittest discover -s tests/scenario-blender-expert -v 2>&1 | tee tests.log
          # A live suite that skips here means Blender did not start: fail instead.
          if grep -q "skipped 'Blender is not installed'" tests.log; then exit 1; fi
