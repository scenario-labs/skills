name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: House style
        run: pnpm style
      - name: Formatting (prettier)
        run: pnpm format:check
      - name: Shared agent commands
        run: pnpm sync:agent-commands:check
      - name: Skill supporting files
        run: pnpm skill-files
      - name: Python lint (ruff, pyflakes rules)
        run: pnpm lint:py
      - name: skills.sh.json grouping coverage
        run: pnpm groupings
      - name: Plugin marketplace manifest in sync
        run: pnpm manifest:check
      - name: README skills table coverage
        run: pnpm readme
      - name: project-words.txt sorted
        run: pnpm words:check
      - name: Spelling (cspell)
        run: pnpm spell
      - name: Spec validation (skills-ref, the Agent Skills reference validator)
        run: pnpm spec

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install per-suite Python dependencies
        run: |
          shopt -s nullglob
          for req in tests/*/requirements.txt; do
            pip install -r "$req"
          done
      - name: Run skill-script test suites
        run: pnpm test

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        run: pnpm exec commitlint --from=origin/${{ github.event.pull_request.base.ref }} --verbose
