name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: House style
        run: pnpm style
      - name: Formatting (prettier)
        run: pnpm format:check
      - name: Shared agent commands
        run: pnpm sync:agent-commands:check
      - name: Skill supporting files
        run: pnpm skill-files
      - name: Python lint (ruff, pyflakes rules)
        run: pnpm lint:py
      - name: skills.sh.json grouping coverage
        run: pnpm groupings
      - name: Plugin marketplace manifest in sync
        run: pnpm manifest:check
      - name: README skills table coverage
        run: pnpm readme
      - name: project-words.txt sorted
        run: pnpm words:check
      - name: Spelling (cspell)
        run: pnpm spell
      - name: Spec validation (skills-ref, the Agent Skills reference validator)
        run: pnpm spec

  script-tests:
    # Each Ubuntu release ships its own apt ffmpeg: 6.1 on 24.04, 8.0 on 26.04. A suite that
    # passed on 6.1 broke on 7.0 (#262). Both are named because ubuntu-latest moves.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg && ffmpeg -version | head -n 1
      - name: Install per-suite Python dependencies
        run: |
          shopt -s nullglob
          for req in tests/*/requirements.txt; do
            pip install -r "$req"
          done
      - name: Run skill-script test suites
        run: pnpm test

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        run: pnpm exec commitlint --from=origin/${{ github.event.pull_request.base.ref }} --verbose
