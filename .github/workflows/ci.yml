name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: House style
        run: pnpm style
      - name: Formatting (prettier)
        run: pnpm format:check
      - name: Shared agent commands
        run: pnpm sync:agent-commands:check
      - name: Skill supporting files
        run: pnpm skill-files
      - name: Python lint (ruff, pyflakes rules)
        run: pnpm lint:py
      - name: skills.sh.json grouping coverage
        run: pnpm groupings
      - name: Plugin marketplace manifest in sync
        run: pnpm manifest:check
      - name: README skills table coverage
        run: pnpm readme
      - name: project-words.txt sorted
        run: pnpm words:check
      - name: Spelling (cspell)
        run: pnpm spell
      - name: Spec validation (skills-ref, the Agent Skills reference validator)
        run: pnpm spec

  script-tests:
    # Each Ubuntu release ships its own apt ffmpeg: 6.1 on 24.04, 8.0 on 26.04. A suite that
    # passed on 6.1 broke on 7.0 (#262). Both are named because ubuntu-latest moves.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg && ffmpeg -version | head -n 1
      - name: Install locked Python test dependencies
        run: |
          pip install --require-hashes --only-binary=:all: -r tests/requirements-ci.txt
      - name: Run skill-script test suites
        # One leg measures coverage: line coverage does not depend on the ffmpeg version.
        env:
          COVERAGE: ${{ matrix.os == 'ubuntu-24.04' && '1' || '' }}
          SKILLS_TEST_USE_SYSTEM_PYTHON: "1"
        run: pnpm test
      - name: Coverage summary
        if: ${{ !cancelled() && matrix.os == 'ubuntu-24.04' && hashFiles('coverage/report.md') != '' }}
        run: cat coverage/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep Cobertura reports for upload-coverage
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cobertura
          path: |
            coverage/python.xml
            coverage/vitest/cobertura-coverage.xml
          if-no-files-found: error

  # A job of its own so code-quality: write never reaches the suites' code. GitHub compares a PR
  # against the main branch's last upload. A fork PR's token cannot write, so it skips.
  upload-coverage:
    needs: script-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-cobertura
          path: coverage
      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage/python.xml
          language: Python
          label: code-coverage/python
      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage/vitest/cobertura-coverage.xml
          language: JavaScript
          label: code-coverage/vitest

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        run: pnpm exec commitlint --from=origin/${{ github.event.pull_request.base.ref }} --verbose
