# Temporary: one real Android export per OS for the gd_perf port. Drop before merge.
name: Godot Android export (temporary)

on:
  push:
    branches: [fix/godot-android-windows]

permissions:
  contents: read

jobs:
  apk:
    name: APK on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      GODOT_RELEASE: 4.7.2-stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 3.12 rather than the newest: before 3.15, Windows Python defaults to the
      # ANSI code page, the case the runner's UTF-8 handling exists for.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Godot
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) asset="Godot_v${GODOT_RELEASE}_linux.x86_64.zip" ;;
            macOS) asset="Godot_v${GODOT_RELEASE}_macos.universal.zip" ;;
            Windows) asset="Godot_v${GODOT_RELEASE}_win64.exe.zip" ;;
          esac
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          curl -fsSL -o "$asset" "$base/$asset"
          curl -fsSL -o sums.txt "$base/SHA512-SUMS.txt"
          grep " ${asset}\$" sums.txt > want.txt
          if command -v sha512sum > /dev/null; then sha512sum -c want.txt; else shasum -a 512 -c want.txt; fi
          # JDK 17 for the Android helper tests: the runners preinstall it but default to other JDKs.
          for v in JAVA_HOME_17_X64 JAVA_HOME_17_arm64; do
            if [ -n "${!v:-}" ]; then echo "JAVA_HOME=${!v}" >> "$GITHUB_ENV"; break; fi
          done
          dir="$RUNNER_TEMP/godot"
          if [ "$RUNNER_OS" = Windows ]; then dir="$(cygpath -u "$RUNNER_TEMP")/godot"; fi
          mkdir -p "$dir"
          case "$RUNNER_OS" in
            Linux)
              unzip -q "$asset" -d "$dir"
              ln -s "$dir/Godot_v${GODOT_RELEASE}_linux.x86_64" "$dir/godot"
              echo "$dir" >> "$GITHUB_PATH"
              ;;
            macOS)
              ditto -x -k "$asset" "$dir"
              echo "GODOT=$dir/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
              ;;
            Windows)
              # The layout winget installs: godot and godot_console on PATH.
              unzip -q "$asset" -d "$dir"
              cp "$dir/Godot_v${GODOT_RELEASE}_win64.exe" "$dir/godot.exe"
              cp "$dir/Godot_v${GODOT_RELEASE}_win64_console.exe" "$dir/godot_console.exe"
              cygpath -w "$dir" >> "$GITHUB_PATH"
              ;;
          esac
      - name: Android debug export
        shell: bash
        env:
          GD_ASSET_CACHE: ${{ runner.temp }}/gd-cache
        run: python -B .github/tmp-godot-android/export_apk.py
