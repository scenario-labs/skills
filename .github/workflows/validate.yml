name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: House style
        run: ./scripts/check-style.sh
      - name: Skill supporting files
        run: ./scripts/check-skill-files.sh
      - name: Spelling (cspell)
        run: ./scripts/check-spelling.sh
      - name: Spec validation (skills-ref, the Agent Skills reference validator)
        run: ./scripts/validate-skills.sh

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install per-suite Python dependencies
        run: |
          shopt -s nullglob
          for req in tests/*/requirements.txt; do
            pip install -r "$req"
          done
      - name: Run skill-script test suites
        run: ./scripts/test-skill-scripts.sh

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        run: pnpm exec commitlint --from=origin/${{ github.event.pull_request.base.ref }} --verbose
