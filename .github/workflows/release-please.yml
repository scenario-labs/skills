on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Mint a GitHub App installation token so the release PR, release
      # commit, and tag are created by the App rather than the default
      # GITHUB_TOKEN. GitHub never triggers workflows from events created
      # with GITHUB_TOKEN (anti-recursion rule), so the App token is what
      # lets the release PR run the same CI as any other PR. The client ID
      # and private key are scenario-labs org secrets.
      - name: Retrieve GitHub App Token
        uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_CLIENT_ID }}
          private-key: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5.0.0
        id: release-please
        with:
          token: ${{ steps.app-token.outputs.token }}

      # The release body is the CHANGELOG.md section this release added. A
      # publish failure only warns: the tag, changelog, and GitHub release
      # already exist, and the run stays green so they are not re-cut.
      - name: Publish changelog to www.scenario.com
        if: ${{ steps.release-please.outputs.release_created }}
        env:
          CHANGELOG_INGEST_SECRET: ${{ secrets.CHANGELOG_INGEST_SECRET }}
          RELEASE_BODY: ${{ steps.release-please.outputs.body }}
        run: |
          curl -sf -X POST https://www.scenario.com/api/changelog/ingest \
            -H "Authorization: Bearer $CHANGELOG_INGEST_SECRET" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg repo "skills" \
              --arg changelog "$RELEASE_BODY" \
              '{repo: $repo, changelog: $changelog}')" || echo "::warning::Changelog publish failed"
