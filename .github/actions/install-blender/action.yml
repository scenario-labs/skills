name: Install Blender
description: Download a Blender Linux release, check its SHA-256, and install the libraries background mode loads.
inputs:
  release:
    description: Blender release, such as 5.2.1
    required: true
outputs:
  path:
    description: Path to the blender binary
    value: ${{ steps.install.outputs.path }}
runs:
  using: composite
  steps:
    - name: Install Blender
      id: install
      shell: bash
      env:
        BLENDER_RELEASE: ${{ inputs.release }}
      run: |
        asset="blender-${BLENDER_RELEASE}-linux-x64.tar.xz"
        base="https://download.blender.org/release/Blender${BLENDER_RELEASE%.*}"
        curl -fsSL -o "$RUNNER_TEMP/$asset" "$base/$asset"
        curl -fsSL -o "$RUNNER_TEMP/sums.txt" "$base/blender-${BLENDER_RELEASE}.sha256"
        grep " ${asset}\$" "$RUNNER_TEMP/sums.txt" > "$RUNNER_TEMP/want.txt"
        (cd "$RUNNER_TEMP" && sha256sum -c want.txt)
        dir="$RUNNER_TEMP/blender"
        mkdir -p "$dir"
        tar -xJf "$RUNNER_TEMP/$asset" -C "$dir" --strip-components=1
        # Background mode still loads the X11 and GL libraries.
        sudo apt-get update -qq
        sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1 > /dev/null
        "$dir/blender" -b --factory-startup --version | head -n 1
        echo "path=$dir/blender" >> "$GITHUB_OUTPUT"
