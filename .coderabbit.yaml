# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for skills. It adds to the organization's central CodeRabbit
# configuration: with inheritance on, lists are combined and a value set here wins over the
# central one. Keep here only what is specific to this repository.
#
# Which copy of this file a review reads: for a pull request from a trusted author (an
# organization member, or a collaborator with write access) the one on the pull request branch;
# otherwise, forks included, the one on the pull request's base commit. A branch created before
# a change picks it up once it includes that change.
#
# To see the settings in force and where each comes from, comment
# "@coderabbitai configuration" on any pull request.

inheritance: true

reviews:
  profile: assertive
  path_instructions:
    - path: "**/*.md"
      instructions: >-
        Agent skills. Each skill is copied into other repositories, so an issue found in one copy
        applies to all of them: report it once and list the copies. Flag only a step that does not
        work, a command or path that does not exist, or an instruction that contradicts the tool it
        describes. No wording, heading or formatting remarks.

knowledge_base:
  code_guidelines:
    # Apply both review documents to every file; by default each governs only its own folder.
    filePatterns:
      - files: ".cursor/BUGBOT.md"
        applyTo: "**/*"
      - files: "REVIEW.md"
        applyTo: "**/*"
